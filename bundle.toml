# Read by scripts/verify_bundle.py; the same script runs in every Awake skill bundle.
name = "awake-agent-skills"
license = "Apache-2.0"
namespace = "awake"
# Top-level, beside skills/: a skill's own agents/ folder holds only its Codex metadata (openai.yaml).
# bump_lock.py reads both from each release, so a consumer's agent_root and command_root follow them.
persona_dir = "agents"
command_dir = "commands"
